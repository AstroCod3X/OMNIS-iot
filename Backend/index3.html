<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNIS - Cloud Infrastructure Control Panel</title>
    <style>
        :root {
            --bg-dark: #090D1A; --bg-card: #131A2E; --accent-cyan: #00E5FF;
            --accent-green: #00E676; --border-slate: #1E2942; --text-light: #F1F5F9; --text-dim: #64748B;
        }
        body {
            margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark); color: var(--text-light); -webkit-font-smoothing: antialiased;
        }
        /* Auth Screen Styling */
        .auth-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-card { background-color: var(--bg-card); border: 1px solid var(--border-slate); padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .auth-card h2 { margin-top: 0; color: #FFF; font-size: 24px; font-weight: 800; }
        .auth-card h2 span { color: var(--accent-cyan); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; font-weight: 700; letter-spacing: 0.5px; }
        .form-group input { width: 100%; padding: 12px; background: #0B0F19; border: 1px solid var(--border-slate); border-radius: 8px; color: #FFF; font-size: 14px; box-sizing: border-box; }
        .form-group input:focus { border-color: var(--accent-cyan); outline: none; }
        .auth-btn { width: 100%; padding: 14px; background: var(--accent-cyan); border: none; border-radius: 8px; color: #000; font-weight: 700; font-size: 14px; cursor: pointer; transition: opacity 0.2s; }
        .auth-btn:hover { opacity: 0.9; }
        .toggle-link { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-dim); cursor: pointer; }
        .toggle-link span { color: var(--accent-cyan); text-decoration: underline; }

        /* Dashboard Core System (Hidden until verified login) */
        #dashboard-view { display: none; }
        .navbar { background-color: var(--bg-card); padding: 18px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-slate); }
        .navbar h1 { margin: 0; font-size: 20px; font-weight: 800; }
        .logout-btn { background: none; border: 1px solid #EF4444; color: #EF4444; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .main-container { max-width: 1300px; margin: 40px auto; padding: 0 25px; }
        .node-info-bar { background: linear-gradient(135deg, var(--bg-card) 0%, #17223C 100%); border: 1px solid var(--border-slate); padding: 25px; border-radius: 16px; margin-bottom: 35px; display: flex; justify-content: space-between; align-items: center; }
        .node-meta h2 { margin: 0 0 6px 0; font-size: 13px; text-transform: uppercase; color: var(--text-dim); letter-spacing: 1.5px; }
        .node-meta div { font-size: 28px; font-weight: 800; font-family: monospace; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .metric-card { background-color: var(--bg-card); border: 1px solid var(--border-slate); border-radius: 16px; padding: 28px; position: relative; overflow: hidden; }
        .metric-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent-cyan); }
        .metric-title { font-size: 13px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; }
        .metric-value { font-size: 42px; font-weight: 800; margin-top: 15px; font-family: monospace; }
    </style>
</head>
<body>

    <div id="auth-view" class="auth-wrapper">
        <div class="auth-card" id="login-box">
            <h2>OMNIS // <span>LOGIN</span></h2>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="login-email" placeholder="dev@omnis.io">
            </div>
            <div class="form-group">
                <label>Account Password</label>
                <input type="password" id="login-password" placeholder="••••••••">
            </div>
            <button class="auth-btn" onclick="executeLogin()">INITIALIZE INSTANCE</button>
            <div class="toggle-link" onclick="toggleAuthPanels(true)">Need an infrastructure profile? <span>Sign Up</span></div>
        </div>

        <div class="auth-card" id="signup-box" style="display: none;">
            <h2>OMNIS // <span>REGISTER</span></h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="reg-username" placeholder="saad_dev">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="reg-email" placeholder="saad@omnis.io">
            </div>
            <div class="form-group">
                <label>Account Password</label>
                <input type="password" id="reg-password" placeholder="••••••••">
            </div>
            <button class="auth-btn" style="background: var(--accent-green);" onclick="executeSignup()">PROVISION PROFILE</button>
            <div class="toggle-link" onclick="toggleAuthPanels(false)">Already have an account? <span>Login</span></div>
        </div>
    </div>

    <div id="dashboard-view">
        <div class="navbar">
            <h1>OMNI // <span>STREAM MATRIX</span></h1>
            <button class="logout-btn" onclick="executeLogout()">TERMINATE SESSION</button>
        </div>
        <div class="main-container">
            <div class="node-info-bar">
                <div class="node-meta">
                    <h2>Active Node Frame Window</h2>
                    <div id="device-title-id">NODE_TEST_01</div>
                </div>
            </div>
            <div class="metrics-grid" id="universal-cards-container">
                </div>
        </div>
    </div>

    <script>
        let streamPollingTimer = null;

        function toggleAuthPanels(showSignup) {
            document.getElementById('login-box').style.display = showSignup ? 'none' : 'block';
            document.getElementById('signup-box').style.display = showSignup ? 'block' : 'none';
        }

        async function executeSignup() {
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            const res = await fetch('http://localhost:3000/api/v1/auth/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });
            const data = await res.json();
            if (res.ok) { alert("Registration Complete! Please log in."); toggleAuthPanels(false); } 
            else { alert(data.error); }
        }

        async function executeLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const res = await fetch('http://localhost:3000/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            
            if (res.ok) {
                // Securely save the session token string inside local storage key storage
                localStorage.setItem('omni_jwt_token', data.sessionToken);
                showDashboardView();
            } else {
                alert(data.error);
            }
        }

        function showDashboardView() {
            document.getElementById('auth-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'block';
            // Start pulling verified loop telemetry metrics frame packets
            streamPollingTimer = setInterval(fetchSecureTelemetryStream, 2000);
            fetchSecureTelemetryStream();
        }

        async function fetchSecureTelemetryStream() {
            const token = localStorage.getItem('omni_jwt_token');
            const targetDevice = 'NODE_TEST_01';

            try {
                const res = await fetch(`http://localhost:3000/api/v1/data/${targetDevice}`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` } // PASSES TOKEN IN HTTP HEADER
                });

                if (res.status === 401 || res.status === 403) { return executeLogout(); }
                const data = await res.json();

                const cardGrid = document.getElementById('universal-cards-container');
                if (data.metrics && Object.keys(data.metrics).length > 0) {
                    cardGrid.innerHTML = '';
                    for (const [key, value] of Object.entries(data.metrics)) {
                        cardGrid.innerHTML += `
                            <div class="metric-card">
                                <div class="metric-title">${key.replace('_', ' ').toUpperCase()}</div>
                                <div class="metric-value">${value}</div>
                            </div>`;
                    }
                }
            } catch (err) { console.error("Telemetry link lost:", err); }
        }

        function executeLogout() {
            clearInterval(streamPollingTimer);
            localStorage.removeItem('omni_jwt_token');
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('auth-view').style.display = 'flex';
        }

        // On system boot, auto-login if a token string already exists
        if (localStorage.getItem('omni_jwt_token')) { showDashboardView(); }
    </script>
</body>
</html>
